name: runconnect
description: RunConnect - A production-grade running community app.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # Supabase
  supabase_flutter:           # auth, database (Postgres), realtime, storage

  # UI
  google_fonts:

  # Navigation
  go_router:

  # State Management
  flutter_bloc:


dev_dependencies:
  flutter_test:
    sdk: flutter


flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/fonts/
